name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Test-only values. The build never connects; E2E uses the Postgres service.
env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
  DATABASE_URL_DIRECT: postgres://postgres:postgres@localhost:5432/postgres
  SESSION_PEPPER: ci-only-pepper-not-a-secret-0123456789abcdef

jobs:
  check:
    name: Lint, types, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci
      - run: pnpm typecheck
      - run: pnpm check:contrast
      - run: pnpm test:coverage
      - run: pnpm build
        env:
          # E2E's Storage stand-in (tests/e2e/fake-storage.ts). Inlined into the
          # bundles and the CSP at build, so only this step needs it; unit
          # tests run without a bucket URL.
          NEXT_PUBLIC_MEDIA_BASE_URL: http://localhost:54330/storage/v1/object/public/media
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: E2E smoke
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: pnpm db:migrate
      - run: pnpm seed --profile e2e
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
