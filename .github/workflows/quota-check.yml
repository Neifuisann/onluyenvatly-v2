name: Daily quota check
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a synthetic quota alert
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency:
  group: quota-check
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read quota snapshot
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          QUOTA_AI_DAILY_LIMIT: ${{ vars.QUOTA_AI_DAILY_LIMIT }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: |
          if [ "$TEST_ALERT" = true ]; then
            node scripts/check-quotas.ts --test-alert
          else
            node scripts/check-quotas.ts
          fi
      - name: Open or update quota alert
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -s tmp/quota-alert.md ]; then
            number=$(gh issue list --state open --search '"Daily quota budget alert" in:title' --json number --jq '.[0].number // empty')
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file tmp/quota-alert.md
            else
              gh issue create --title "Daily quota budget alert" --body-file tmp/quota-alert.md
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: quota-snapshot
          path: tmp/quota-snapshot.json
          retention-days: 30
