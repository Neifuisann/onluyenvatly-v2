name: Migrate

# 12 §3: staging is migrated automatically when migrations land on main;
# production only by a manual run with the `production` environment approval,
# BEFORE merging code that depends on the new schema.
on:
  push:
    branches: [main]
    paths: ["src/db/migrations/**"]
  workflow_dispatch:
    inputs:
      target:
        description: Database to migrate
        type: choice
        options: [staging, production]
        default: staging
      mode:
        description: Schema only or complete legacy data rehearsal
        type: choice
        options: [schema, rehearsal]
        default: schema
      dry_run:
        description: Roll back rehearsal data writes
        type: boolean
        default: true

concurrency:
  group: migrate-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: drizzle-kit migrate (${{ github.event.inputs.target || 'staging' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event.inputs.target || 'staging' }}
    env:
      DATABASE_URL_DIRECT: ${{ (github.event.inputs.target || 'staging') == 'production' && secrets.DATABASE_URL_DIRECT || secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure IPv4 session connection
        run: node scripts/configure-ci-database.ts
        env:
          SUPABASE_SESSION_POOLER_HOST: ${{ vars.SUPABASE_SESSION_POOLER_HOST }}
      # Direct/session connection strings, never a transaction pooler (:6543):
      # staging = NEON_DATABASE_URL (Neon, non-pooled host); production =
      # DATABASE_URL_DIRECT (Supabase session pooler :5432, since the
      # db.<ref>.supabase.co host is IPv6-only and runners have no IPv6).
      - run: pnpm db:migrate
      - name: Rehearse legacy users, lessons and history
        if: inputs.mode == 'rehearsal'
        run: node scripts/migrate-legacy.ts --skip-media ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          V1_DATABASE_URL: ${{ secrets.V1_DATABASE_URL }}
      - name: Verify source comparisons
        if: inputs.mode == 'rehearsal' && !inputs.dry_run
        run: node scripts/verify-migration.ts
        env:
          V1_DATABASE_URL: ${{ secrets.V1_DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'rehearsal'
        with:
          name: migration-counts
          path: |
            tmp/migration-history-report.json
            tmp/migration-verification.json
          retention-days: 30
